name: lint

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both from apt: this is the combination the checks were verified against.
      # luarocks needs Lua headers and installs against whichever interpreter it
      # picks, which is one more thing to go wrong for no benefit here.
      - name: Install Lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 lua-check

      - name: Syntax check
        run: luac5.3 -p src/*.lua

      - name: luacheck
        run: luacheck src

      # luacheck does not know that a Lua local is invisible above its own
      # declaration when the same name exists as a global. This does.
      - name: Scope check
        run: python3 tools/check_scope.py src
